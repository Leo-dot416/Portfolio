<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Java Projects — Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <h1>Java Projects</h1>
        <p class="tagline">A list of Java programs in this repository.</p>
        <img class="hero-illustration" alt="Java code" src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?q=80&w=1200&auto=format&fit=crop&ixlib=rb-4.0.3&s=2b6a1b4f6b4e6c7d8f9a0b1c2d3e4f5a">
      </div>
    </header>

    <main class="content">
      <div class="list-card card">
        <p id="status">Loading Java projects…</p>
        <ul id="file-list"></ul>
        <p class="muted" id="hint">Links open on GitHub.</p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <a href="/">← Back to home</a>
      </div>
    </footer>

    <script>
      (function(){
        const owner = 'Leo-dot416';
        const repo = 'Portfolio';
        const dir = 'java';
        const api = `https://api.github.com/repos/${owner}/${repo}/contents/${dir}`;

        function linkFor(item){
          return `https://github.com/${owner}/${repo}/blob/main/${dir}/${encodeURIComponent(item.name)}`;
        }

        fetch(api)
          .then(r => r.json())
          .then(data => {
            const list = document.getElementById('file-list');
            const status = document.getElementById('status');
            if (!Array.isArray(data) || data.length === 0){
              status.textContent = 'No Java projects found in the repository.';
              return;
            }
            status.style.display = 'none';
            data.forEach(item => {
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.href = linkFor(item);
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              a.textContent = item.name + (item.type === 'dir' ? '/' : '');
              li.appendChild(a);
              list.appendChild(li);
            });
          })
          .catch(err => {
            document.getElementById('status').textContent = 'Failed to load projects.';
            console.error(err);
          });
      })();
    </script>
  </body>
</html>
